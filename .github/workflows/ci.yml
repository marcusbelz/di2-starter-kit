name: CI

# Template CI (/init rewrites this header for the project). Jobs:
# - db-dry-run-deploy: the SQL gate - a real dry-run deploy against a throwaway PostgreSQL 17
#   service, the db/tests assertions and an idempotency re-deploy. NO secrets (ephemeral DB,
#   committed local creds 'pw', see db/config/local.env*), so it also runs from fork PRs.
#   /init removes this job when database == none.
# - lint: shellcheck + the repo guards under scripts/ (stack-independent, prune-proof).
# - app (added by /init): the project's lint + test commands from .claude/rules/stack.md -
#   the "green means complete" test gate of .claude/rules/testing.md.
# UI projects (react-tailwind-shadcn flavor): wire the shipped type-scale guard into the app
# lint - .claude/rules/ui/react-tailwind-shadcn/eslint-rules/no-raw-font-size.mjs
# (wiring: eslint.config.snippet.mjs next to it, docs: brand.md "Enforcement").

on:
  pull_request:
    branches: [main, master]
  push:
    # main too: a merge that lands on main without a PR (local merge + push) must get a CI run,
    # because /deploy prod requires a green run on exactly that merge commit.
    branches: [dev, main]

permissions:
  contents: read

jobs:
  db-dry-run-deploy:
    name: db-dry-run-deploy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # postgres superuser password = the service's POSTGRES_PASSWORD (not a secret; local).
      DB_ADMIN_PASSWORD_POSTGRES: pw
      PGPASSWORD: pw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure psql client
        run: |
          command -v psql >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          psql --version

      - name: create.sh local (database, schema, roles, users)
        run: bash db/scripts/create.sh local

      - name: deploy.sh all local (all schema objects)
        run: bash db/scripts/deploy.sh all local

      - name: db/tests assertions
        run: |
          for f in db/tests/example/*.sql; do
            echo ">>> test $f"
            psql -h localhost -p 5432 -U postgres -d app_local \
              -v ON_ERROR_STOP=1 \
              -f db/config/local.env.sql \
              -f "$f"
          done

      - name: deploy.sh all local again (idempotency check)
        run: bash db/scripts/deploy.sh all local

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prune-proof: checks only the shell scripts that exist (a project without db/ has none there).
      - name: shellcheck (bash scripts)
        run: |
          shopt -s nullglob
          files=(db/scripts/*.sh db/tests/*.sh scripts/*.sh)
          if [ ${#files[@]} -eq 0 ]; then echo "no shell scripts to check"; exit 0; fi
          shellcheck --severity=warning "${files[@]}"

      - name: table-group number lint (NUMBERS.md registry)
        if: hashFiles('db/scripts/lint-numbers.sh') != ''
        run: bash db/scripts/lint-numbers.sh

      # Guards under scripts/*.mjs are dependency-free Node scripts (node: builtins only,
      # no package.json) - see .claude/rules/README.md "Guard anatomy".
      - name: Set up Node (repo guards)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: markdown link check (no dead relative links)
        run: node scripts/check-md-links.mjs

      - name: context budget (instructions loaded in every session; rule map vs. scoped rules)
        run: node scripts/check-context-budget.mjs --top

      - name: file-size guard (no source file above the line limit)
        run: node scripts/check-file-size.mjs

      - name: bug index check (counts, order, file/row parity, status vs. location)
        run: node scripts/check-bugs.mjs

      # UI projects only - /init removes this step together with docs/test-cases/ when ui == none.
      - name: test-case catalog check (cases/suites/INDEX parity, manual-AC parity)
        run: node scripts/check-testcases.mjs
